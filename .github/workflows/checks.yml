name: Check public examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 openpyxl
      - run: python scripts/generate_samples.py
      - run: python scripts/export_notebooks.py --check
      - run: python -m unittest discover -s tests -v
